        .diagram-svg .clickable {

            transition: all 0.15s ease;

        .diagram-svg .clickable:hover rect {
            stroke: var(--accent-color);
            stroke-width: 2;
        }
        .diagram-svg .clickable.selected rect {
            stroke: var(--accent-color);
            stroke-width: 2.5;

        .diagram-svg {
            width: 100%;
            height: 100%;
        }
        #diagram-container {
            overflow: hidden;
            padding: 0;
            position: relative;
        }
        .zoom-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            display: flex;
            gap: 8px;
            z-index: 10;
        }
        .zoom-btn {
            width: 36px;
            height: 36px;
            border: 1px solid var(--border-color);
            background: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
        }
        .zoom-btn:hover {
            background: var(--bg-color);
            border-color: var(--accent-color);

        .icon {
            font-size: 14px;
            margin-right: 4px;

    <script>
        // Initialize pan-zoom
        const panZoom = svgPanZoom('#diagram', {
            zoomEnabled: true,
            controlIconsEnabled: false,
            fit: true,
            center: true,
            minZoom: 0.5,
            maxZoom: 3,
            zoomScaleSensitivity: 0.3
        });

        // Zoom controls
        document.getElementById('zoom-in').addEventListener('click', () => panZoom.zoomIn());
        document.getElementById('zoom-out').addEventListener('click', () => panZoom.zoomOut());
        document.getElementById('zoom-reset').addEventListener('click', () => {
            panZoom.resetZoom();
            panZoom.center();
        });

        // Handle clicks on diagram elements
        document.querySelectorAll('.clickable').forEach(el => {
            el.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                const id = this.getAttribute('data-id');

                document.querySelectorAll('.clickable').forEach(c => c.classList.remove('selected'));
                this.classList.add('selected');

                loadMd(id);
            });
        });

        async function loadMd(id) {
            const content = document.getElementById('content');

            try {
                const response = await fetch(`docs/${id}.md`);
                if (response.ok) {
                    const text = await response.text();
                    content.innerHTML = marked.parse(text);
                } else {
                    content.innerHTML = `<h2>Not Found</h2><p>Documentation not found for: <code>${id}</code></p><p>Create file: <code>docs/${id}.md</code></p>`;
                }
            } catch (e) {
                content.innerHTML = `<h2>Error</h2><p>Failed to load documentation.</p>`;
            }
        }
    </script>
